<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.card { background:#1e293b; padding:30px; border-radius:16px; width:340px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
h2 { text-align:center; margin-top:0; }
input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none; outline:none; background:#334155; color:white; box-sizing:border-box; }
button { width:48%; padding:10px; margin:4px 1%; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
button:nth-of-type(1){ background:#22c55e; }
button:nth-of-type(2){ background:#3b82f6; color:white; }
button:nth-of-type(3){ background:#f59e0b; }
button:nth-of-type(4){ background:#ef4444; color:white; }
#out { background:#0f172a; padding:10px; border-radius:8px; margin-top:15px; min-height:20px; font-size:13px; word-break:break-all; border:1px dashed #334155; }
small { display:block; text-align:center; margin-top:10px; color:#94a3b8; }
</style>
</head>
<body>
<div class="card">
<h2>🔒 Secure Auth</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<div>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="profile()">Profile</button>
<button onclick="logout()">Logout</button>
</div>
<pre id="out">Output will show here...</pre>
<small>JWT + HttpOnly Cookie Demo</small>
</div>

<script>
const API = 'http://localhost:5000/api/auth';
async function register(){
  let r = await fetch(API+'/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:email.value, password:pass.value})});
  out.innerText = await r.text();
}
async function login(){
  let r = await fetch(API+'/login', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({email:email.value, password:pass.value})});
  out.innerText = await r.text();
}
async function profile(){
  let r = await fetch(API+'/profile', {credentials:'include'});
  out.innerText = await r.text();
}
async function logout(){
  let r = await fetch(API+'/logout', {method:'POST', credentials:'include'});
  out.innerText = await r.text();
}
</script>
</body>
</html>
